name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - gh-actions
      - sailplane-rename

permissions:
  contents: read
  packages: read

env:
  TELEGRAM_PPC_JOBS: "2"
  TELEGRAM_PPC_FFMPEG_LINKAGE: static
  TELEGRAM_PPC_TOOLCHAIN_IMAGE: ghcr.io/doctashay/darwin-legacy-cross:static-curl-20260622

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake shellcheck

      - name: Check shell syntax
        run: |
          bash -n scripts/build-universal.sh
          bash -n scripts/build-ffmpeg-static.sh
          bash -n scripts/ci/bootstrap-common-deps.sh
          bash -n scripts/ci/bootstrap-darwin-xtools.sh
          bash -n scripts/ci/bootstrap-ffmpeg.sh
          bash -n scripts/ci/bootstrap-gcc14.sh
          bash -n scripts/ci/bootstrap-openssl.sh
          bash -n scripts/ci/bootstrap-osxcross.sh
          bash -n scripts/ci/bootstrap-tdlib.sh
          bash -n scripts/ci/bootstrap-zlib.sh
          bash -n scripts/ci/check-repo.sh
          bash -n scripts/ci/use-darwin-legacy-cross-env.sh
          bash -n scripts/ci/write-build-config.sh
          bash -n scripts/ci/verify-release-app.sh

      - name: Run ShellCheck
        run: |
          shellcheck \
            scripts/build-universal.sh \
            scripts/build-ffmpeg-static.sh \
            scripts/ci/*.sh

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            .github/workflows/ci.yml \
            .github/workflows/release.yml

      - name: Scan for committed secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose

      - name: Check repository hygiene
        run: scripts/ci/check-repo.sh

      - name: Prepare dummy credentials
        run: cp TelegramCredentials.example.h TelegramCredentials.h

      - name: Verify CMake metadata is readable
        run: cmake --version

  toolchain:
    name: Darwin cross toolchain
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull toolchain image
        run: docker pull "$TELEGRAM_PPC_TOOLCHAIN_IMAGE"

      - name: Verify toolchain image
        run: |
          docker run --rm "$TELEGRAM_PPC_TOOLCHAIN_IMAGE" bash -lc '
            set -euo pipefail
            . /opt/darwin-legacy-cross/bin/darwin-legacy-cross-env
            test -n "$DARWIN_CA_BUNDLE"
            for arch in PPC I386 X86_64 ARM64; do
              eval "test -n \"\${DARWIN_${arch}_CURL_ROOT}\""
              eval "test -n \"\${DARWIN_${arch}_OPENSSL_ROOT}\""
              eval "test -n \"\${DARWIN_${arch}_ZLIB_ROOT}\""
              eval "test -n \"\${DARWIN_${arch}_TDLIB_LIBRARY}\""
              eval "test -n \"\${DARWIN_${arch}_FFMPEG_ROOT}\""
            done
            test-all-targets
          '

  cross-build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    needs:
      - hygiene
      - toolchain
    strategy:
      fail-fast: false
      matrix:
        arch:
          - ppc
          - i386
          - x86_64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull toolchain image
        run: docker pull "$TELEGRAM_PPC_TOOLCHAIN_IMAGE"

      - name: Prepare dummy credentials
        run: cp TelegramCredentials.example.h TelegramCredentials.h

      - name: Build ${{ matrix.arch }} app
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -e TELEGRAM_PPC_JOBS \
            -e TELEGRAM_PPC_FFMPEG_LINKAGE \
            -e TELEGRAM_PPC_VERSION=0.2.1 \
            -e TELEGRAM_PPC_BUILD_NUMBER="${{ github.run_number }}" \
            "$TELEGRAM_PPC_TOOLCHAIN_IMAGE" \
            bash -lc '
              set -euo pipefail
              cd /work
              . /opt/darwin-legacy-cross/bin/darwin-legacy-cross-env
              export TELEGRAM_PPC_BUILD_ROOT=/work/build
              export TELEGRAM_PPC_DIST_DIR=/work/dist
              . scripts/ci/use-darwin-legacy-cross-env.sh
              if [ "${{ matrix.arch }}" = ppc ]; then
                . scripts/ci/use-vendored-ppcports-tdlib.sh
              fi
              scripts/ci/write-build-config.sh local-build-config.ci.sh
              scripts/build-universal.sh --config local-build-config.ci.sh --clean --arch "${{ matrix.arch }}" --skip-assemble
            '
          sudo chown -R "$USER:$USER" build local-build-config.ci.sh

      - name: Verify ${{ matrix.arch }} app
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            "$TELEGRAM_PPC_TOOLCHAIN_IMAGE" \
            bash -lc '
              set -euo pipefail
              cd /work
              . /opt/darwin-legacy-cross/bin/darwin-legacy-cross-env
              app="build/build-${{ matrix.arch }}/Sailplane.app"
              binary="$app/Contents/MacOS/Sailplane"
              frameworks="$app/Contents/Frameworks"
              plist="$app/Contents/Info.plist"
              test -x "$binary"
              test -f "$frameworks/libtdjson.dylib"
              test -f "$plist"
              "$DARWIN_LIPO" "$binary" -verify_arch "${{ matrix.arch }}"
              if [ "${{ matrix.arch }}" = ppc ]; then
                "$DARWIN_LIPO" "$frameworks/libtdjson.dylib" -verify_arch ppc ||
                  "$DARWIN_LIPO" "$frameworks/libtdjson.dylib" -verify_arch ppc7400
              else
                "$DARWIN_LIPO" "$frameworks/libtdjson.dylib" -verify_arch "${{ matrix.arch }}"
              fi
              bad_loads="$(
                {
                  printf "%s\n" "$binary"
                  find "$frameworks" -maxdepth 1 -type f -name "*.dylib"
                } | while read -r target; do
                  "$DARWIN_OTOOL" -L "$target" 2>/dev/null | awk "/^[[:space:]]/ {print \$1}" | grep -E "/opt/local|/home/|/mnt/|/tmp/" || true
                done | sort -u
              )"
              if [ -n "$bad_loads" ]; then
                echo "app contains non-relocatable load commands:" >&2
                echo "$bad_loads" >&2
                exit 1
              fi
            '

      - name: Pack ${{ matrix.arch }} app
        run: tar -czf "thin-${{ matrix.arch }}.tgz" -C "build/build-${{ matrix.arch }}" Sailplane.app

      - name: Upload ${{ matrix.arch }} app
        uses: actions/upload-artifact@v7
        with:
          name: ci-thin-app-${{ matrix.arch }}
          path: thin-${{ matrix.arch }}.tgz
          retention-days: 7

  universal-dmg:
    name: Universal DMG
    runs-on: macos-latest
    needs:
      - cross-build

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download thin apps
        uses: actions/download-artifact@v8
        with:
          pattern: ci-thin-app-*
          merge-multiple: true
          path: thin-apps

      - name: Unpack thin apps
        run: |
          set -euo pipefail
          for arch in ppc i386 x86_64 arm64; do
            archive="thin-apps/thin-$arch.tgz"
            test -f "$archive"
            mkdir -p "build/build-$arch"
            tar -xzf "$archive" -C "build/build-$arch"
          done

      - name: Assemble and verify universal app
        run: |
          set -euo pipefail
          sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
          install_name_tool="$(xcrun --find install_name_tool)"
          otool="$(xcrun --find otool)"
          lipo="$(xcrun --find lipo)"

          export TELEGRAM_PPC_BUILD_ROOT="$GITHUB_WORKSPACE/build"
          export TELEGRAM_PPC_DIST_DIR="$GITHUB_WORKSPACE/dist"
          export TELEGRAM_PPC_SDK_ROOT="$sdk_root"
          export TELEGRAM_PPC_INSTALL_NAME_TOOL="$install_name_tool"
          export TELEGRAM_PPC_OTOOL="$otool"
          export TELEGRAM_PPC_LIPO="$lipo"
          export TELEGRAM_PPC_VERSION="0.2.1"
          export TELEGRAM_PPC_BUILD_NUMBER="${{ github.run_number }}"

          # The config writer includes every optional per-architecture variable.
          # build-universal.sh expands those variables even in --skip-build mode.
          scripts/ci/write-build-config.sh local-build-config.ci.sh

          . ./local-build-config.ci.sh
          scripts/build-universal.sh --config local-build-config.ci.sh --skip-build
          scripts/ci/verify-release-app.sh dist/Sailplane.app
          "$TELEGRAM_PPC_LIPO" -info dist/Sailplane.app/Contents/MacOS/Sailplane
          "$TELEGRAM_PPC_LIPO" -info dist/Sailplane.app/Contents/Frameworks/libtdjson.dylib

      - name: Create and verify universal DMG
        run: |
          set -euo pipefail
          dmg_name="Sailplane-0.2.1-ci.${{ github.run_number }}-universal.dmg"

          rm -rf dmg-root dmg-mount artifacts
          mkdir -p dmg-root dmg-mount artifacts
          cp -a dist/Sailplane.app dmg-root/

          hdiutil create \
            -volname Sailplane \
            -srcfolder dmg-root \
            -fs HFS+ \
            -layout SPUD \
            -ov \
            -format UDZO \
            "artifacts/$dmg_name"
          shasum -a 256 "artifacts/$dmg_name" > "artifacts/$dmg_name.sha256"

          hdiutil attach -nobrowse -mountpoint dmg-mount "artifacts/$dmg_name"
          test -d dmg-mount/Sailplane.app
          hdiutil detach dmg-mount

      - name: Upload ready-to-use universal DMG
        uses: actions/upload-artifact@v7
        with:
          name: Sailplane-universal-DMG
          path: |
            artifacts/*.dmg
            artifacts/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  apple-silicon:
    name: Apple Silicon macOS 26
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          brew install cmake pkg-config nlohmann-json tdlib ffmpeg ca-certificates

      - name: Prepare dummy credentials
        run: cp TelegramCredentials.example.h TelegramCredentials.h

      - name: Configure arm64 app
        run: |
          ca_bundle="$(brew --prefix)/etc/ca-certificates/cert.pem"
          test -f "$ca_bundle"
          cmake -S . -B build/apple-silicon \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DTELEGRAM_PPC_MIN_SYSTEM_VERSION=11.0 \
            -DTELEGRAM_PPC_CPU_TARGET=native \
            -DTELEGRAM_PPC_CA_BUNDLE="$ca_bundle"

      - name: Build arm64 app
        run: cmake --build build/apple-silicon -- -j"$(sysctl -n hw.ncpu)"

      - name: Verify arm64 app bundle
        run: |
          app="$(find build/apple-silicon -maxdepth 1 -name "*.app" -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          plutil -lint "$app/Contents/Info.plist"
          file "$binary"
          lipo "$binary" -verify_arch arm64
          otool -L "$binary"
          {
            echo "APP_BUNDLE=$app"
            echo "APP_EXECUTABLE=$executable"
          } >> "$GITHUB_ENV"

      - name: Prepare Apple Silicon artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/apple-silicon
          cp -R "$APP_BUNDLE" artifacts/apple-silicon/

      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v7
        with:
          name: apple-silicon-app
          path: artifacts/apple-silicon
          retention-days: 14
