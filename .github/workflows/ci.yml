name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - gh-actions
      - sailplane-rename

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake shellcheck

      - name: Check shell syntax
        run: |
          bash -n scripts/build-universal.sh
          bash -n scripts/build-ffmpeg-static.sh
          bash -n scripts/ci/bootstrap-common-deps.sh
          bash -n scripts/ci/bootstrap-darwin-xtools.sh
          bash -n scripts/ci/bootstrap-ffmpeg.sh
          bash -n scripts/ci/bootstrap-gcc14.sh
          bash -n scripts/ci/bootstrap-openssl.sh
          bash -n scripts/ci/bootstrap-osxcross.sh
          bash -n scripts/ci/bootstrap-tdlib.sh
          bash -n scripts/ci/bootstrap-zlib.sh
          bash -n scripts/ci/check-repo.sh
          bash -n scripts/ci/write-build-config.sh
          bash -n scripts/ci/verify-release-app.sh

      - name: Run ShellCheck
        run: |
          shellcheck \
            scripts/build-universal.sh \
            scripts/build-ffmpeg-static.sh \
            scripts/ci/*.sh

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:latest \
            .github/workflows/ci.yml \
            .github/workflows/release.yml

      - name: Scan for committed secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose

      - name: Check repository hygiene
        run: scripts/ci/check-repo.sh

      - name: Prepare dummy credentials
        run: cp TelegramCredentials.example.h TelegramCredentials.h

      - name: Verify CMake metadata is readable
        run: cmake --version

  apple-silicon:
    name: Apple Silicon macOS 26
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          brew install cmake pkg-config nlohmann-json tdlib ffmpeg

      - name: Prepare dummy credentials
        run: cp TelegramCredentials.example.h TelegramCredentials.h

      - name: Configure arm64 app
        run: |
          cmake -S . -B build/apple-silicon \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DTELEGRAM_PPC_MIN_SYSTEM_VERSION=11.0 \
            -DTELEGRAM_PPC_CPU_TARGET=native

      - name: Build arm64 app
        run: cmake --build build/apple-silicon -- -j"$(sysctl -n hw.ncpu)"

      - name: Verify arm64 app bundle
        run: |
          app="$(find build/apple-silicon -maxdepth 1 -name "*.app" -print -quit)"
          test -n "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          plutil -lint "$app/Contents/Info.plist"
          file "$binary"
          lipo "$binary" -verify_arch arm64
          otool -L "$binary"
          {
            echo "APP_BUNDLE=$app"
            echo "APP_EXECUTABLE=$executable"
          } >> "$GITHUB_ENV"

      - name: Launch app and capture screen
        run: |
          set -euo pipefail

          mkdir -p artifacts/apple-silicon
          open -n "$APP_BUNDLE"

          for _ in $(seq 1 20); do
            if pgrep -x "$APP_EXECUTABLE" >/dev/null; then
              break
            fi
            sleep 1
          done
          pgrep -x "$APP_EXECUTABLE" >/dev/null

          for _ in $(seq 1 20); do
            window_count="$(osascript -e "tell application \"System Events\" to count windows of process \"$APP_EXECUTABLE\"" 2>/dev/null || echo 0)"
            if [ "$window_count" -gt 0 ]; then
              break
            fi
            sleep 1
          done

          osascript -e "tell application \"System Events\" to count windows of process \"$APP_EXECUTABLE\"" > artifacts/apple-silicon/window-count.txt
          test "$(cat artifacts/apple-silicon/window-count.txt)" -gt 0

          screencapture -x artifacts/apple-silicon/launch.png
          cp -R "$APP_BUNDLE" artifacts/apple-silicon/
          cp -R "$HOME/Library/Logs/DiagnosticReports" artifacts/apple-silicon/DiagnosticReports 2>/dev/null || true
          pkill -x "$APP_EXECUTABLE" || true

      - name: Upload Apple Silicon launch artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-silicon-launch
          path: artifacts/apple-silicon
          retention-days: 14
